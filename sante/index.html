<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Ma Santé 🫀</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Santé">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon.svg">

<style>
  :root{
    --ink:#12201C; --panel:#1B2B24; --panel2:#213329; --line:#2E4038;
    --bone:#F0ECE0; --fog:#8FA398; --moss:#7FA66B; --ember:#E2823D;
    --flame:#C1483A; --signal:#5FA8D3; --violet:#9B84C9;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--ink);color:var(--bone);}
  body{font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%;}
  .display{font-family:'Big Shoulders Display','IBM Plex Sans',sans-serif;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:var(--signal);}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  /* HERO */
  .hero{padding:calc(24px + env(safe-area-inset-top)) 20px 18px;border-bottom:1px solid var(--line);}
  .kicker{font-size:11px;letter-spacing:.12em;color:var(--fog);text-transform:uppercase;margin-bottom:6px;}
  .hero-big{font-size:clamp(46px,13vw,84px);font-weight:800;line-height:.9;color:var(--bone);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .hero-unit{font-size:clamp(15px,4vw,22px);font-family:'IBM Plex Sans',sans-serif;font-weight:500;color:var(--fog);}
  .hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:14px;margin-top:22px;}
  .stat-v{font-size:24px;font-weight:700;color:var(--bone);}
  .stat-l{font-size:11px;color:var(--fog);margin-top:2px;}

  /* TABS */
  .tabs{display:flex;gap:2px;padding:12px 12px 0;border-bottom:1px solid var(--line);
    overflow-x:auto;position:sticky;top:0;background:var(--ink);z-index:5;}
  .tab{background:none;border:none;padding:9px 13px 12px;font-size:13px;font-weight:600;
    white-space:nowrap;color:var(--fog);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
  .tab.active{color:var(--ember);border-bottom-color:var(--ember);}

  .wrap{padding:18px 16px 40px;max-width:920px;margin:0 auto;}
  .sect-t{font-size:14px;font-weight:600;color:var(--bone);}
  .sect-s{font-size:12px;color:var(--fog);margin-top:2px;}
  .info{font-size:12.5px;color:var(--fog);line-height:1.5;margin-top:6px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:620px){.grid2{grid-template-columns:1fr;}}
  .chart{position:relative;width:100%;}
  .chart-tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;padding:7px 9px;font-size:11.5px;color:var(--bone);opacity:0;transition:opacity .1s;
    z-index:3;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translate(-50%,-115%);}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--fog);flex-wrap:wrap;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:10px 14px;font-size:10px;color:var(--fog);text-transform:uppercase;
    letter-spacing:.06em;font-weight:500;border-bottom:1px solid var(--line);}
  td{padding:10px 14px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block;}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--bone);border-radius:6px;
    padding:10px 14px;font-size:13px;font-weight:600;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--ember);border-color:var(--ember);color:#20140a;}
  .btn-ghost{background:none;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--fog);}
  .field input,.field select{background:var(--ink);border:1px solid var(--line);color:var(--bone);
    border-radius:6px;padding:9px 10px;font-size:14px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--ember);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--line);color:var(--bone);padding:11px 18px;border-radius:8px;
    font-size:13px;opacity:0;transition:all .25s;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .prog{height:8px;background:var(--ink);border-radius:99px;overflow:hidden;border:1px solid var(--line);}
  .prog>i{display:block;height:100%;background:var(--ember);width:0;transition:width .2s;}
  .muted{color:var(--fog);}
  .footer{padding:16px;font-size:11px;color:var(--fog);border-top:1px solid var(--line);text-align:center;}
</style>
</head>

/* ---------- Construit le store initial à partir du SEED ---------- */
function isoWeekToThursday(weekKey){
  const [y,wRaw] = weekKey.split("-W"); const week=parseInt(wRaw,10);
  const jan4 = new Date(parseInt(y,10),0,4);
  const dow = (jan4.getDay()+6)%7; // 0=lundi
  const mondayW1 = new Date(jan4); mondayW1.setDate(jan4.getDate()-dow);
  const thu = new Date(mondayW1); thu.setDate(mondayW1.getDate()+7*(week-1)+3);
  return thu.toISOString().slice(0,10);
}
function seedStore(){
  const R = SEED_RAW;
  return {
    imported: {
      vo2max: R.vo2max.slice(),
      rhr_daily: R.rhr_daily.slice(),
      weight_daily: R.weight_daily.slice(),
      sleep_nightly: R.sleep_nightly.slice(),
      runs: R.runs.slice(),
      other_activities: R.other_activities.slice(),
      meta: { source:"Apple Santé (snapshot)", when:"14 août 2026" },
    },
    manual: { weight:[], lab_entries: SEED.lab_entries.slice(), fidage: SEED.fidage,
      smoke_quit:"2026-07-18T16:50:00", cigs_per_day:10, price_per_cig:0.896 },
    seed: true,
    seedVersion: SEED_VERSION,
  };
}

/* ---------- Persistance ----------
   SEED_VERSION : à incrémenter à chaque mise à jour des données d'exemple.
   Tant que l'utilisateur n'a rien saisi lui-même (seed !== false), on
   rafraîchit automatiquement l'exemple vers la dernière version publiée. */
const SEED_VERSION = 5;
let STORE = load();
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){
    const s = JSON.parse(raw);
    if(s && s.seed !== false && s.seedVersion !== SEED_VERSION){ const fresh = seedStore(); persist(fresh); return fresh; }
    return s;
  } }catch(e){}
  const s = seedStore(); persist(s); return s;
}
function persist(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){ toast("Stockage plein — impossible de sauvegarder"); } }
function saveStore(){ STORE.seed=false; persist(STORE); }

/* ============================================================
   Agrégation : transforme le store brut en données d'affichage
   ============================================================ */
function isoWeekKey(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const t = new Date(d.valueOf());
  const dayNr = (d.getDay()+6)%7;
  t.setDate(t.getDate()-dayNr+3);
  const firstThu = new Date(t.getFullYear(),0,4);
  const week = 1+Math.round(((t-firstThu)/86400000 - 3 + ((firstThu.getDay()+6)%7))/7);
  return `${t.getFullYear()}-W${String(week).padStart(2,"0")}`;
}
function weeklyAvg(points, valKey){
  const m={};
  points.forEach(p=>{ const wk=isoWeekKey(p.date); (m[wk]=m[wk]||[]).push(p[valKey]); });
  return Object.keys(m).sort().map(wk=>({week:wk, value:+(m[wk].reduce((a,b)=>a+b,0)/m[wk].length).toFixed(2), n:m[wk].length}));
}
function linreg(pts){
  const n=pts.length; if(n<2) return null;
  let sx=0,sy=0,sxx=0,sxy=0;
  pts.forEach(p=>{sx+=p.t;sy+=p.v;sxx+=p.t*p.t;sxy+=p.t*p.v;});
  const d=n*sxx-sx*sx; if(!d) return null;
  const b=(n*sxy-sx*sy)/d; return {a:(sy-b*sx)/n,b};
}
function project(points, valKey, monthsAhead){
  const pts = points.map(p=>({t:new Date(p.date+"T00:00:00").getTime()/86400000, v:p[valKey]}));
  const recent = pts.slice(-8);
  const r = linreg(recent); if(!r) return points.length?points[points.length-1][valKey]:null;
  const lastT = pts[pts.length-1].t;
  return +(r.a + r.b*(lastT+monthsAhead*30.4)).toFixed(1);
}

function compute(){
  const I = STORE.imported, M = STORE.manual;
  const runs = (I.runs||[]).slice().sort((a,b)=>a.datetime<b.datetime?-1:1);
  const vo2 = (I.vo2max||[]).slice().sort((a,b)=>a.date<b.date?-1:1);

  // Poids : importé + saisi à la main
  const weightPts = (I.weight_daily||[]).slice()
    .concat((M.weight||[]).map(w=>({date:w.date, value:w.kg})))
    .sort((a,b)=>a.date<b.date?-1:1);

  const rhrWeekly = weeklyAvg(I.rhr_daily||[], "value");
  const weightWeekly = weeklyAvg(weightPts, "value").map(w=>({week:w.week, avg_kg:w.value}));
  const sleepWeekly = (function(){
    const m={};
    (I.sleep_nightly||[]).forEach(n=>{ const wk=isoWeekKey(n.date); (m[wk]=m[wk]||[]).push(n.total/60); });
    return Object.keys(m).sort().map(wk=>({week:wk, avg_hours:+(m[wk].reduce((a,b)=>a+b,0)/m[wk].length).toFixed(2), nights:m[wk].length}));
  })();

  // Composition du sommeil = moyenne des 2 dernières semaines de nuits
  const sc = (function(){
    const nights = (I.sleep_nightly||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    if(!nights.length) return {deep_min:0,rem_min:0,core_min:0,total_min:0};
    const lastWk = isoWeekKey(nights[nights.length-1].date);
    const recent = nights.filter(n=>{ const wk=isoWeekKey(n.date); return wk>=isoWeekKey(nights[Math.max(0,nights.length-14)].date); });
    const use = recent.length?recent:nights.slice(-14);
    const avg = k=>use.reduce((a,n)=>a+(n[k]||0),0)/use.length;
    return {deep_min:+avg("deep").toFixed(1),rem_min:+avg("rem").toFixed(1),core_min:+avg("core").toFixed(1),total_min:+avg("total").toFixed(1)};
  })();

  // Volume hebdo + effort
  const volMap={}, effMap={};
  runs.forEach(r=>{
    const wk=isoWeekKey(r.date);
    if(!volMap[wk]) volMap[wk]={week:wk,distance:0,count:0};
    volMap[wk].distance+=r.distance_km; volMap[wk].count++;
    if(!effMap[wk]) effMap[wk]={week:wk,facile:0,modere:0,intense:0,inconnu:0};
    effMap[wk][r.effort||"inconnu"]+=r.distance_km;
  });
  const weekly_volume = Object.keys(volMap).sort().map(wk=>({week:wk,distance:+volMap[wk].distance.toFixed(1),count:volMap[wk].count}));
  const weeklyEffort = Object.keys(effMap).sort().map(wk=>effMap[wk]);
  const ec={facile:0,modere:0,intense:0};
  runs.forEach(r=>{ if(r.effort) ec[r.effort]++; });
  const ecTotal=ec.facile+ec.modere+ec.intense;

  // Résumé
  const totalDist = runs.reduce((a,r)=>a+r.distance_km,0);
  const totalTime = runs.reduce((a,r)=>a+r.duration_min,0);
  const paces = runs.map(r=>r.pace_min_km).filter(p=>p>0);
  const summary = {
    total_distance:+totalDist.toFixed(1), total_runs:runs.length,
    avg_pace: totalDist? +(totalTime/totalDist).toFixed(2):null,
    best_pace: paces.length? Math.min(...paces):null,
    vo2_start: vo2.length?vo2[0].value:null, vo2_now: vo2.length?vo2[vo2.length-1].value:null,
    rhr_now: rhrWeekly.length?rhrWeekly[rhrWeekly.length-1].value:null,
  };

  const projections = {
    vo2max: { current: summary.vo2_now, "1m": project(vo2,"value",1), "3m": project(vo2,"value",3) },
    resting_hr: { current: summary.rhr_now,
      "1m": project(rhrWeekly.map(w=>({date:isoWeekToThursday(w.week),value:w.value})),"value",1),
      "3m": project(rhrWeekly.map(w=>({date:isoWeekToThursday(w.week),value:w.value})),"value",3) },
  };

  // Bilan sanguin depuis les saisies
  const labs = buildLabs(M.lab_entries||[]);
  labs.fidage = M.fidage || null;

  return { summary, vo2max:vo2, resting_hr_weekly:rhrWeekly, weekly_weight:weightWeekly,
    weekly_sleep:sleepWeekly, sleep_composition:sc, weekly_volume, weeklyEffort,
    effortCounts:{...ec,total:ecTotal,facilePct:ecTotal?Math.round(ec.facile/ecTotal*100):0},
    runs, other_activities:I.other_activities||[], projections, labs, weightPts };
}

function buildLabs(entries){
  const sorted = entries.slice().sort((a,b)=>a.date<b.date?-1:1);
  const dates = sorted.map(e=>e.date);
  const series={};
  MARKERS.forEach(m=>{ series[m.key]=sorted.map(e=> (e.values && e.values[m.key]!=null)? e.values[m.key] : null); });
  // points hors norme → attention
  const attention=[];
  MARKERS.forEach(m=>{
    const pts = sorted.map(e=>({date:e.date,v:e.values?e.values[m.key]:null})).filter(p=>p.v!=null);
    if(!pts.length) return;
    const last = pts[pts.length-1];
    const below = last.v < m.range[0], above = last.v > m.range[1];
    const bad = (m.dir==="low" && below) || (m.dir==="high" && above) || (m.dir==="both" && (below||above));
    if(bad){
      attention.push({severity:"warn", title:`${m.label} hors norme`,
        detail:`${last.v} ${m.unit} au dernier bilan (${fmtDate(last.date)}). Norme du labo : ${rangeText(m)}. À discuter avec ton médecin.`});
    } else if(pts.length>=3){
      const first=pts[0].v, worseHigh=(m.dir==="high"||m.dir==="both") && last.v>first*1.2;
      const worseLow=(m.dir==="low") && last.v<first*0.85;
      if(worseHigh||worseLow){
        attention.push({severity:"info", title:`${m.label} — tendance à surveiller`,
          detail:`${first} → ${last.v} ${m.unit} entre ${fmtDate(pts[0].date)} et ${fmtDate(last.date)}. Reste dans la norme, mais la tendance vaut d'être mentionnée.`});
      }
    }
  });
  if(!attention.length && sorted.length){
    attention.push({severity:"good", title:"Rien hors norme", detail:"Tous tes marqueurs disponibles sont dans les seuils du labo. Continue comme ça !"});
  }
  return { dates, series, attention_points:attention };
}

/* ---------- Formatage ---------- */
function fmtPace(min){ if(min==null) return "—"; const m=Math.floor(min),s=Math.round((min-m)*60);
  return s===60?`${m+1}:00`:`${m}:${String(s).padStart(2,"0")}`; }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00");
  return dt.toLocaleDateString("fr-BE",{day:"2-digit",month:"short",year:"2-digit"}); }
function fmtMY(d){ if(!d) return ""; const dt=new Date(d+"T00:00:00");
  return dt.toLocaleDateString("fr-BE",{month:"short"})+" "+String(dt.getFullYear()).slice(2); }
function weekYear(week){ return week.split("-W")[0]; }
function fmtHM(totalMin){ const h=Math.floor(totalMin/60),m=Math.round(totalMin%60); return `${h}h${String(m).padStart(2,"0")}`; }

/* ---------- Appréciations « excellent / bon / à surveiller / hors norme » ---------- */
function ratePill(r){ if(!r) return ""; const c=(r.t==="great"||r.t==="good")?C.moss:r.t==="warn"?C.ember:C.flame;
  return `<span class="pill" style="background:${c}26;color:${c};font-size:10px;font-weight:600">${r.l}</span>`; }
function rateVO2(v){ if(v==null)return null; if(v>=52)return{l:"Excellent",t:"great"}; if(v>=45)return{l:"Très bon",t:"good"}; if(v>=40)return{l:"Bon",t:"good"}; if(v>=35)return{l:"Moyen",t:"warn"}; return{l:"À travailler",t:"bad"}; }
function rateRHR(v){ if(v==null)return null; if(v<58)return{l:"Excellent",t:"great"}; if(v<65)return{l:"Bon",t:"good"}; if(v<72)return{l:"Correct",t:"warn"}; return{l:"Élevé",t:"bad"}; }
function rateLab(v,m){ if(v==null||!m)return null; const lo=m.range[0], hi=m.range[1];
  if(m.dir==="high"){ if(v>hi)return{l:"Hors norme",t:"bad"}; const p=hi>0?v/hi:0; if(p<=0.5)return{l:"Excellent",t:"great"}; if(p<=0.8)return{l:"Bon",t:"good"}; return{l:"Limite",t:"warn"}; }
  if(m.dir==="low"){ if(v<lo)return{l:"Hors norme",t:"bad"}; if(v>=lo*1.5)return{l:"Excellent",t:"great"}; if(v>=lo*1.2)return{l:"Bon",t:"good"}; return{l:"Correct",t:"warn"}; }
  if(v<lo||v>hi)return{l:"Hors norme",t:"bad"}; const mid=(lo+hi)/2, half=(hi-lo)/2||1; return (Math.abs(v-mid)/half<=0.6)?{l:"Bon",t:"good"}:{l:"Limite",t:"warn"}; }

/* ---------- Arrêt du tabac (compteur live) ---------- */
let smokeTimer=null;
function smokeFree(){
  const q=STORE.manual&&STORE.manual.smoke_quit; if(!q) return null;
  const quit=new Date(q).getTime(); if(isNaN(quit)) return null;
  const ms=Date.now()-quit; if(ms<0) return null;
  const cpd=(STORE.manual.cigs_per_day!=null)?STORE.manual.cigs_per_day:10;
  const ppc=(STORE.manual.price_per_cig!=null)?STORE.manual.price_per_cig:0.9;
  const dFrac=ms/86400000;
  return { quit, quitStr:q.slice(0,10), ms,
    days:Math.floor(dFrac), hours:Math.floor(ms%86400000/3600000),
    mins:Math.floor(ms%3600000/60000), secs:Math.floor(ms%60000/1000),
    cigs:Math.floor(cpd*dFrac), money:cpd*dFrac*ppc, cpd };
}
function updateSmoke(){
  const s=smokeFree(), d=document.getElementById("sf-d");
  if(!s||!d){ if(smokeTimer){clearInterval(smokeTimer); smokeTimer=null;} return; }
  d.textContent=s.days;
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  set("sf-h",String(s.hours).padStart(2,"0"));
  set("sf-m",String(s.mins).padStart(2,"0"));
  set("sf-s",String(s.secs).padStart(2,"0"));
  set("sf-cig",s.cigs);
  set("sf-money",Math.round(s.money)+" €");
}
function rangeText(m){ if(m.range[0]<=0 && m.range[1]>=999) return `≥ ${m.range[0]}`;
  if(m.range[1]>=999) return `≥ ${m.range[0]}`; if(m.range[0]<=0) return `≤ ${m.range[1]}`; return `${m.range[0]}–${m.range[1]}`; }

/* ============================================================
   Graphiques SVG (aucune dépendance)
   ============================================================ */
const SVGNS="http://www.w3.org/2000/svg";
function sv(tag,a){ const e=document.createElementNS(SVGNS,tag); for(const k in a) e.setAttribute(k,a[k]); return e; }
function niceTicks(min,max,count){
  const span=max-min||1, step0=span/count, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag, step=(norm>=5?5:norm>=2?2:1)*mag;
  const t0=Math.ceil(min/step)*step, out=[];
  for(let v=t0; v<=max+1e-9; v+=step) out.push(+v.toFixed(6));
  return out;
}
function attachTip(container, svg, layout, onIndex){
  let tip=container.querySelector(".chart-tip");
  if(!tip){ tip=document.createElement("div"); tip.className="chart-tip"; container.appendChild(tip); }
  const {mL,mR,W,n,x}=layout;
  const guide=sv("line",{stroke:C.fog,"stroke-width":1,"stroke-dasharray":"3 3",opacity:0});
  svg.appendChild(guide);
  function handle(ev){
    const rect=svg.getBoundingClientRect();
    const px=(ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left;
    let i=Math.round((px-mL)/((W-mL-mR)/Math.max(1,n-1)));
    i=Math.max(0,Math.min(n-1,i));
    const res=onIndex(i); if(!res){ hide(); return; }
    const gx=x(i);
    guide.setAttribute("x1",gx); guide.setAttribute("x2",gx);
    guide.setAttribute("y1",layout.mT); guide.setAttribute("y2",layout.H-layout.mB);
    guide.setAttribute("opacity",.5);
    tip.innerHTML=res.html; tip.style.opacity=1;
    tip.style.left=Math.max(4,Math.min(W-4,gx))+"px";
    tip.style.top=(res.top!=null?res.top:layout.mT+10)+"px";
  }
  function hide(){ tip.style.opacity=0; guide.setAttribute("opacity",0); }
  svg.addEventListener("pointermove",handle);
  svg.addEventListener("pointerdown",handle);
  svg.addEventListener("pointerleave",hide);
  svg.addEventListener("touchmove",handle,{passive:true});
  svg.addEventListener("touchstart",handle,{passive:true});
  svg.addEventListener("touchend",hide);
}
function lineChart(container, cfg){
  container.classList.add("chart");
  const W=Math.max(220,container.clientWidth||280), H=cfg.height||150;
  const mL=cfg.mL!=null?cfg.mL:34, mR=12, mT=10, mB=22;
  const svg=sv("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`,style:"display:block;touch-action:pan-y"});
  const all=[]; cfg.series.forEach(s=>s.values.forEach(v=>{if(v!=null)all.push(v);}));
  let yMin=cfg.yMin!=null?cfg.yMin:Math.min(...all), yMax=cfg.yMax!=null?cfg.yMax:Math.max(...all);
  if(yMin===yMax){yMin-=1;yMax+=1;}
  const n=cfg.n||cfg.series[0].values.length;
  const x=i=> n<=1? (mL+(W-mL-mR)/2) : mL+i*(W-mL-mR)/(n-1);
  const y=v=> mT+(H-mT-mB)*(1-(v-yMin)/(yMax-yMin));
  const ticks=cfg.yTicks||niceTicks(yMin,yMax,4);
  ticks.forEach(t=>{ if(t<yMin-1e-9||t>yMax+1e-9)return;
    svg.appendChild(sv("line",{x1:mL,x2:W-mR,y1:y(t),y2:y(t),stroke:C.line,"stroke-dasharray":"2 4"}));
    const lb=sv("text",{x:mL-6,y:y(t)+3,"text-anchor":"end","font-size":10,fill:C.fog}); lb.textContent=cfg.yFmt?cfg.yFmt(t):t;
    svg.appendChild(lb);
  });
  if(cfg.xTick){ for(let i=0;i<n;i++){ const lb=cfg.xTick(i); if(lb==null||lb==="")continue;
    const anchor = x(i)<mL+18?"start":x(i)>W-mR-18?"end":"middle";
    const t=sv("text",{x:x(i),y:H-6,"text-anchor":anchor,"font-size":9,fill:C.fog}); t.textContent=lb; svg.appendChild(t); } }
  cfg.series.forEach((s,si)=>{
    if(s.area){
      const id="grad"+Math.random().toString(36).slice(2,7);
      const defs=sv("defs",{}); const lg=sv("linearGradient",{id,x1:0,y1:0,x2:0,y2:1});
      lg.appendChild(sv("stop",{offset:"0%","stop-color":s.color,"stop-opacity":.45}));
      lg.appendChild(sv("stop",{offset:"100%","stop-color":s.color,"stop-opacity":0}));
      defs.appendChild(lg); svg.appendChild(defs);
      let d="",started=false,firstX=null,lastX=null;
      s.values.forEach((v,i)=>{ if(v==null){return;} const X=x(i),Y=y(v); if(!started){d=`M ${X} ${Y}`;firstX=X;started=true;}else d+=` L ${X} ${Y}`; lastX=X; });
      if(started){ d+=` L ${lastX} ${y(yMin)} L ${firstX} ${y(yMin)} Z`;
        svg.appendChild(sv("path",{d,fill:`url(#${id})`})); }
    }
    let d="",started=false;
    s.values.forEach((v,i)=>{ if(v==null){started=false;return;} const X=x(i),Y=y(v);
      if(!started){d+=`M ${X} ${Y}`;started=true;}else d+=` L ${X} ${Y}`; });
    svg.appendChild(sv("path",{d,fill:"none",stroke:s.color,"stroke-width":s.width||2.5,"stroke-linejoin":"round","stroke-linecap":"round"}));
    if(s.dots) s.values.forEach((v,i)=>{ if(v==null)return; svg.appendChild(sv("circle",{cx:x(i),cy:y(v),r:s.dotR||2.5,fill:s.color})); });
  });
  container.innerHTML=""; container.appendChild(svg);
  attachTip(container, svg, {mL,mR,mT,mB,W,H,n,x}, (i)=>{
    const rows=cfg.tip(i); if(!rows) return null;
    const vals=cfg.series.map(s=>s.values[i]).filter(v=>v!=null);
    const top = vals.length? y(Math.max(...vals)) : mT;
    return { html: rows, top };
  });
}
function barChart(container, cfg){
  container.classList.add("chart");
  const W=Math.max(220,container.clientWidth||280), H=cfg.height||150;
  const mL=cfg.mL!=null?cfg.mL:30, mR=12, mT=10, mB=22;
  const svg=sv("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`,style:"display:block;touch-action:pan-y"});
  const n=cfg.items.length;
  const keys=cfg.keys;
  let yMax=cfg.yMax!=null?cfg.yMax:0;
  if(!cfg.yMax){ cfg.items.forEach(it=>{ let s=0; keys.forEach(k=>s+=(it[k.key]||0)); if(s>yMax)yMax=s; }); yMax=yMax*1.1||1; }
  const bw=(W-mL-mR)/n, barW=Math.min(26,bw*0.64);
  const x=i=> mL+bw*i+bw/2;
  const y=v=> mT+(H-mT-mB)*(1-v/yMax);
  niceTicks(0,yMax,4).forEach(t=>{ if(t>yMax)return;
    svg.appendChild(sv("line",{x1:mL,x2:W-mR,y1:y(t),y2:y(t),stroke:C.line,"stroke-dasharray":"2 4"}));
    const lb=sv("text",{x:mL-6,y:y(t)+3,"text-anchor":"end","font-size":10,fill:C.fog}); lb.textContent=cfg.yFmt?cfg.yFmt(t):t; svg.appendChild(lb);
  });
  if(cfg.xTick){ cfg.items.forEach((it,i)=>{ const lb=cfg.xTick(i); if(lb==null||lb==="")return;
    const anchor = x(i)<mL+18?"start":x(i)>W-mR-18?"end":"middle";
    const t=sv("text",{x:x(i),y:H-6,"text-anchor":anchor,"font-size":9,fill:C.fog}); t.textContent=lb; svg.appendChild(t); }); }
  cfg.items.forEach((it,i)=>{ let base=0;
    keys.forEach((k,ki)=>{ const v=it[k.key]||0; if(v<=0)return;
      const h=(H-mT-mB)*v/yMax; const yTop=y(base+v);
      const r=(ki===keys.length-1 || keys.slice(ki+1).every(kk=>!(it[kk.key]>0)))?3:0;
      svg.appendChild(sv("rect",{x:x(i)-barW/2,y:yTop,width:barW,height:Math.max(0,h),fill:k.color,rx:r}));
      base+=v;
    });
  });
  container.innerHTML=""; container.appendChild(svg);
  attachTip(container, svg, {mL,mR,mT,mB,W,H,n,x}, (i)=>{ const rows=cfg.tip(i); if(!rows)return null;
    let base=0; cfg.keys.forEach(k=>base+=(cfg.items[i][k.key]||0)); return {html:rows, top:y(base)}; });
}

let D = compute();

function h(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  D = compute();
  if(smokeTimer){ clearInterval(smokeTimer); smokeTimer=null; }
  const app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(heroEl());

}

function heroEl(){
  const s=D.summary, sc=D.sleep_composition;
  const delta = (s.vo2_now!=null&&s.vo2_start!=null)? (s.vo2_now-s.vo2_start):null;
  const pct = (delta!=null&&s.vo2_start)? Math.round(delta/s.vo2_start*100):null;
  const el=h(`<div class="hero">
    <div class="kicker mono">Ma santé · Apple Watch + bilans</div>
    <div class="hero-big display">${s.vo2_now!=null?s.vo2_now:"—"}<span class="hero-unit">mL/min/kg — VO2 max</span></div>
    <div style="margin-top:6px">${ratePill(rateVO2(s.vo2_now))}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap">
      ${delta!=null?`<span class="mono" style="color:${delta>=0?C.moss:C.flame};font-weight:600;font-size:15px">${delta>=0?"+":""}${delta.toFixed(1)} depuis le début</span>
      ${pct!=null?`<span style="color:${C.fog};font-size:13px">— la taille de ton moteur a ${delta>=0?"grossi":"changé"} de ${Math.abs(pct)}%</span>`:""}`:""}
    </div>
    <div class="hero-stats">
      ${statTile(s.total_distance!=null?s.total_distance:"—","km","Distance totale")}
      ${statTile(s.total_runs,"","Sorties course")}
      ${statTile(fmtPace(s.avg_pace),"/km","Allure moy.")}
      ${statTile(s.rhr_now!=null?s.rhr_now:"—","bpm","FC repos")}
      ${statTile(sc.total_min?fmtHM(sc.total_min):"—","","Sommeil / nuit")}
    </div>
  </div>`);
  return el;
}
function statTile(v,u,l){ return `<div><div class="stat-v mono display">${v}</div><div class="stat-l">${l} <span class="mono" style="opacity:.7">${u}</span></div></div>`; }

function tabsEl(){
  const el=h(`<div class="tabs"></div>`);
  TABS.forEach(t=>{ const b=h(`<button class="tab ${TAB===t.id?"active":""}">${t.emoji} ${t.label}</button>`);
    b.onclick=()=>{ TAB=t.id; render(); document.querySelector(".wrap").scrollIntoView({block:"start"}); };
    el.appendChild(b); });
  return el;
}

function sectionTitle(t,s){ return `<div style="margin-bottom:10px"><div class="sect-t">${t}</div>${s?`<div class="sect-s">${s}</div>`:""}</div>`; }
function chartHost(id,h){ return `<div class="chart" id="${id}" style="height:${h}px;margin-top:10px"></div>`; }

  if(!labs.dates.length){
    wrap.appendChild(h(`<div class="card" style="padding:20px;text-align:center">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">Aucun bilan sanguin saisi</div>

      <button class="btn btn-primary" id="goData">Saisir un bilan</button></div>`));
    document.getElementById("goData").onclick=()=>{TAB="donnees";render();};
    return;
  }
  const ap=h(`<div class="card" style="padding:18px;margin-bottom:16px">
    ${sectionTitle("⚠️ Points d'attention","Générés automatiquement à partir de tes valeurs face aux seuils du labo")}
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px"></div>

  const apBox=ap.querySelector("div>div").parentElement.querySelector("div[style*='flex-direction']");
  labs.attention_points.forEach(p=>{
    const col=p.severity==="warn"?C.ember:p.severity==="good"?C.moss:C.signal;
    apBox.appendChild(h(`<div style="padding:10px 14px;background:${C.panel2};border-left:3px solid ${col};border-radius:4px">

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px"></div>

    const rbox=fc.children[fc.children.length-2];
    (f.risks||[]).forEach(r=>{ const t=r.tone||(r.level==="faible"?"good":r.level==="accrue"?"warn":"bad");

        <div style="font-size:10px;color:${C.fog};margin-top:2px">${fmtDate(p.date)}</div></div>`)); });
    wrap.appendChild(g2);
  }
}

/* ============================================================
   ONGLET PROGRÈS : tableau départ → actuel (sport, sang, poids)
   ============================================================ */
function fmtWeekDate(week){ return fmtDate(isoWeekToThursday(week)); }
function progImprovement(first,last,dir){
  const d=last-first;
  if(Math.abs(d)<1e-9) return "neutral";
  if(dir==="high") return d>0?"good":"bad";
  if(dir==="low")  return d<0?"good":"bad";
  return "neutral";
}
function fmtNum(v){ if(v==null) return "—"; return (Math.round(v*100)/100).toString(); }
function progRow(label, first, last, unit, dir, subFrom, subTo){
  if(first==null||last==null) return null;
  const tone=progImprovement(first,last,dir);
  const d=last-first;
  const pct = first!==0 ? d/Math.abs(first)*100 : 0;
  const arrow = d>0?"↑":d<0?"↓":"→";
  const deltaTxt = `${arrow} ${d>0?"+":""}${fmtNum(d)}${unit?" "+unit:""}`;
  return {label, first, last, unit, tone, deltaTxt, absPct:Math.abs(pct), subFrom, subTo, dir};
}

function renderProgres(wrap){
  const sport=[], poids=[], sang=[];

  // ---- Sport / forme ----
  const vo2=D.vo2max;
  if(vo2.length>=2){ const r=progRow("VO2 max", vo2[0].value, vo2[vo2.length-1].value, "mL/min/kg", "high", fmtDate(vo2[0].date), fmtDate(vo2[vo2.length-1].date));
    if(r){ r.rating=rateVO2(vo2[vo2.length-1].value); sport.push(r); } }
  const rhr=D.resting_hr_weekly;
  if(rhr.length>=2){ const r=progRow("FC de repos", rhr[0].value, rhr[rhr.length-1].value, "bpm", "low", fmtWeekDate(rhr[0].week), fmtWeekDate(rhr[rhr.length-1].week));
    if(r){ r.rating=rateRHR(rhr[rhr.length-1].value); sport.push(r); } }
  // Volume hebdo moyen : 4 premières vs 4 dernières semaines
  const vol=D.weekly_volume;
  if(vol.length>=4){
    const avg=arr=>arr.reduce((a,w)=>a+w.distance,0)/arr.length;
    sport.push(progRow("Volume hebdo moyen", +avg(vol.slice(0,4)).toFixed(1), +avg(vol.slice(-4)).toFixed(1), "km/sem", "high", fmtWeekDate(vol[0].week), fmtWeekDate(vol[vol.length-1].week)));
  }

  // ---- Poids ----
  const w=D.weekly_weight;
  if(w.length>=2) poids.push(progRow("Poids", w[0].avg_kg, w[w.length-1].avg_kg, "kg", "neutral", fmtWeekDate(w[0].week), fmtWeekDate(w[w.length-1].week)));

  // ---- Prise de sang ----
  // MARKERS.dir = sens « défavorable » ; on le convertit en « sens qui progresse »
  MARKERS.forEach(m=>{
    const pts=labSeriesVals(m.key);
    if(pts.length<2) return;
    const betterDir = m.dir==="high" ? "low" : m.dir==="low" ? "high" : "neutral";
    const r=progRow(m.label, pts[0].v, pts[pts.length-1].v, m.unit, betterDir, fmtDate(pts[0].date), fmtDate(pts[pts.length-1].date));
    if(r){ r.rating=rateLab(pts[pts.length-1].v, m); sang.push(r); }
  });

  const allRows=[...sport,...poids,...sang].filter(Boolean);
  if(!allRows.length){
    wrap.appendChild(h(`<div class="card" style="padding:22px;text-align:center">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">Pas encore de quoi comparer</div>
      <div class="info" style="margin-bottom:14px">Importe tes données ou saisis au moins deux bilans pour voir ta progression.</div>
      <button class="btn btn-primary" id="pgo">📥 Aller à Données</button></div>`));
    document.getElementById("pgo").onclick=()=>{TAB="donnees";render();}; return;
  }

  // ---- Temps forts ----
  const wins=allRows.filter(r=>r.tone==="good").sort((a,b)=>b.absPct-a.absPct).slice(0,3);
  if(wins.length){
    const hc=h(`<div class="card" style="padding:18px;margin-bottom:16px;border-color:${C.moss}55">
      ${sectionTitle("🏅 Tes plus belles progressions","Depuis le début de ton suivi")}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:6px"></div></div>`);
    const box=hc.lastElementChild;
    wins.forEach(rrow=>{
      box.appendChild(h(`<div>
        <div style="font-size:11px;color:${C.fog};margin-bottom:2px">${esc(rrow.label)}</div>
        <div class="display mono" style="font-size:22px;font-weight:700;color:${C.moss}">${rrow.first} → ${rrow.last}</div>
        <div class="mono" style="font-size:12px;color:${C.moss};margin-top:2px">${rrow.deltaTxt}</div></div>`));
    });
    wrap.appendChild(hc);
  }

  // ---- Tableaux par domaine ----
  progressGroup(wrap, "🏃 Sport & forme", sport);
  progressGroup(wrap, "⚖️ Poids", poids);
  progressGroup(wrap, "🩸 Prise de sang", sang, true);

/* ============================================================
   ONGLET COACH : conseils médecin + préparateur longévité
   Moteur basé sur des règles (aucune donnée envoyée) — à partir
   de TES chiffres. Ce ne sont pas des prescriptions médicales.
   ============================================================ */
function labLatest(key){
  const s=D.labs.series&&D.labs.series[key]; if(!s) return null;
  for(let i=s.length-1;i>=0;i--){ if(s[i]!=null) return {value:s[i], date:D.labs.dates[i]}; }
  return null;
}
function labSeriesVals(key){ const s=(D.labs.series&&D.labs.series[key])||[]; return D.labs.dates.map((d,i)=>({date:d,v:s[i]})).filter(p=>p.v!=null); }

function coachData(){
  const s=D.summary, sc=D.sleep_composition, f=D.labs.fidage;
  const age = f && f.chronological_age ? f.chronological_age : null;
  const vo2 = s.vo2_now;
  const rhr = s.rhr_now;
  const nightH = sc.total_min? sc.total_min/60 : null;
  const deep = sc.deep_min, rem = sc.rem_min;
  const ec = D.effortCounts;
  const nWeeks = D.weekly_volume.length||1;
  const avgKm = D.weekly_volume.reduce((a,w)=>a+w.distance,0)/nWeeks;
  const strengthTypes = ["FunctionalStrengthTraining","TraditionalStrengthTraining","CoreTraining","HighIntensityIntervalTraining"];
  const hasStrength = (D.other_activities||[]).some(a=>strengthTypes.includes(a.type));
  const vitD = labLatest("vitamine_d"), crp = labLatest("crp"), ldl = labLatest("ldl"),
        hdl = labLatest("hdl"), trig = labLatest("triglycerides"), ggt = labLatest("gamma_gt"),
        ferr = labSeriesVals("ferritine"), psa = labSeriesVals("psa"), gly = labLatest("glycemie");
  const sf = smokeFree();
  const smoking = sf ? false : !!(f && (f.risks||[]).some(r=>/tabac|fumeur/i.test(r.detail+" "+r.label)));
  const bioGap = (f && f.biological_age && f.chronological_age)? f.biological_age-f.chronological_age : null;
  return {age,vo2,rhr,nightH,deep,rem,ec,avgKm,hasStrength,vitD,crp,ldl,hdl,trig,ggt,ferr,psa,gly,smoking,sf,bioGap,fat:f&&f.body_fat_pct};
}

function coachPriorities(c){
  const P=[];
  if(c.sf) P.push({tone:"good",title:`Tenir ton arrêt du tabac — ${c.sf.days} jours 🎉`,body:"Tu as fait le plus gros geste possible pour ta longévité, et tu tiens. <b>Ne lâche rien</b>, surtout ce premier mois où l'envie revient par vagues (elle passe en quelques minutes). Chaque jour, ton risque cardiovasculaire et ton inflammation baissent."});
  else if(c.smoking) P.push({tone:"bad",title:"Arrêter le tabac",body:"C'est <b>le</b> levier n°1 pour ton espérance de vie en bonne santé. Il tire vers le haut ton inflammation (CRP), ton stress oxydatif et ton risque cardiovasculaire — les trois choses qui gonflent ton âge biologique. Si tu as déjà arrêté, fais corriger l'info dans ton dossier."});
  if(!c.hasStrength) P.push({tone:"warn",title:"Ajouter 2 séances de musculation / semaine",body:"Tu cours, tu plonges, tu fais du hockey — mais je ne vois <b>aucune séance de force</b>. Après 45 ans on perd 1–2% de muscle par an. La force est le meilleur bouclier anti-âge : métabolisme, os, équilibre, autonomie plus tard. C'est ton plus gros gain potentiel."});
  if(c.vitD && c.vitD.value<30) P.push({tone:"warn",title:"Remonter ta vitamine D",body:`À ${c.vitD.value} ng/mL tu es en zone « insuffisant » (cible ≥ 30). Elle soutient os, muscles et immunité — d'autant plus utile que tu veux protéger ta masse musculaire. Supplémentation à caler avec ton médecin.`});
  if(c.crp && c.crp.value>3) P.push({tone:"warn",title:"Faire baisser l'inflammation (CRP)",body:`Ta CRP est à ${c.crp.value} mg/L (seuil ≤ 3). Une inflammation « de bas grade » use l'organisme sur la durée. Leviers : tabac, sommeil profond, alcool/foie, alimentation anti-inflammatoire. À recontrôler au prochain bilan.`});
  if(P.length<3 && c.bioGap && c.bioGap>0) P.push({tone:"warn",title:"Refermer l'écart d'âge biologique",body:`Ton âge biologique estimé dépasse ton âge réel de ${c.bioGap} ans — mais il est tiré par des facteurs <b>modifiables</b> (inflammation, stress oxydatif). Bonne nouvelle : chaque priorité ci-dessus le fait redescendre.`});
  if(P.length<3) P.push({tone:"good",title:"Continuer sur ta lancée cardio",body:`Ton VO2 max grimpe fort et ton profil lipidique est excellent. Verrouille la régularité (course facile + 1 séance rapide) et ajoute la force pour un corps complet.`});
  return P;
}

function coachSections(c){
  const S=[];
  // Cardio & VO2max
  const cardio={icon:"🫀",title:"Cardio & VO2 max — ton moteur",items:[]};
  if(c.vo2!=null){
    const lvl = c.vo2>=50?"supérieur (parmi les meilleurs pour ton âge)":c.vo2>=43?"bon à très bon":c.vo2>=35?"moyen":"à développer";
    cardio.items.push({tone:c.vo2>=43?"good":"warn",h:`VO2 max ${c.vo2} — niveau « ${lvl} »`,
      body:`Le VO2 max est l'un des <b>meilleurs prédicteurs de longévité</b> qu'on connaisse : mieux vaut être ici que dans la moyenne. ${c.age?`Pour un homme de ${c.age} ans, `:""}ton chiffre est excellent — objectif maintenant : le <b>maintenir haut</b> dans la durée, ce qui compte plus que de battre des records.`});
  }
  cardio.items.push({tone:"good",h:`Garde la règle du 80/20 (tu es à ~${c.ec.facilePct}% facile)`,
    body:`La majorité de tes sorties en Zone 2 (facile, tu peux tenir une conversation) construit le moteur sans t'user. Ajoute <b>une</b> séance rapide/semaine (ex : 4×4 min forts / 3 min récup, ou 30/30) pour continuer à pousser le plafond. Ne dépasse pas ~20% de dur.`});
  cardio.items.push({tone:"info",h:"La progression va ralentir — c'est normal",
    body:`Tu as pris beaucoup de VO2 max récemment (les « gains de débutant »). Plus tu montes, plus chaque point se mérite. Vise la <b>constance sur 6–12 mois</b> plutôt que la courbe qui monte tout droit.`});
  S.push(cardio);

  // Force
  S.push({icon:"🏋️",title:"Force & masse musculaire — le pilier oublié",items:[
    {tone:c.hasStrength?"good":"warn",
     h:c.hasStrength?"Tu fais déjà de la force — continue":"Aucune séance de force détectée",
     body:c.hasStrength?"Garde 2 séances/semaine avec surcharge progressive (un peu plus lourd/plus de reps au fil des semaines)."
       :"C'est le grand absent de ton entraînement. 2 séances full-body par semaine (squat, soulevé/charnière de hanche, tirage, poussée, port de charge) suffisent. La force protège les <b>os</b> (utile vu ta vitamine D basse), le métabolisme, l'équilibre — et c'est ce qui détermine ton autonomie à 70-80 ans."},
    {tone:"info",h:"Protéines : le carburant du muscle",
     body:`Vise ~1,6 g de protéines par kg et par jour, réparties sur les repas. Muscu + protéines + un peu de vitamine D = le trio anti-fonte musculaire.`},
  ]});

  // Sommeil
  const sleep={icon:"🌙",title:"Sommeil — ta récupération",items:[]};
  if(c.nightH){
    sleep.items.push({tone:(c.nightH>=7&&c.nightH<=9)?"good":"warn",h:`~${c.nightH.toFixed(1)} h par nuit`,
      body:(c.nightH>=7&&c.nightH<=9)?"Pile dans la zone idéale (7–9 h). C'est là que le corps répare le muscle et nettoie le cerveau — un pilier de longévité au même titre que le sport.":"Vise 7–9 h. Le manque de sommeil augmente l'inflammation et la faim, et freine la récupération."});
  }
  if(c.deep!=null){
    sleep.items.push({tone:c.deep>=60?"good":"warn",h:`Sommeil profond ~${Math.round(c.deep)} min`,
      body:c.deep>=60?"Bon niveau de sommeil profond — c'est la phase la plus réparatrice."
        :"Un peu court côté sommeil profond. Pour en gagner : horaires réguliers, chambre <b>fraîche et sombre</b>, pas d'alcool ni d'écran juste avant, et… l'activité physique (que tu fais déjà)."});
  }
  sleep.items.push({tone:"info",h:"La régularité prime sur la durée",
    body:"Te coucher/lever à heures fixes (même le week-end) vaut mieux qu'une grasse mat' pour compenser. Ton corps adore la routine."});
  S.push(sleep);

  // Nutrition & inflammation & lipides
  const nutri={icon:"🥗",title:"Nutrition, inflammation & cœur",items:[]};
  const lip=[];
  if(c.hdl) lip.push(`HDL ${c.hdl.value}`); if(c.ldl) lip.push(`LDL ${c.ldl.value}`); if(c.trig) lip.push(`triglycérides ${c.trig.value}`);
  if(lip.length) nutri.items.push({tone:"good",h:"Ton bilan lipidique est excellent",
    body:`${lip.join(", ")} mg/dL — HDL haut, LDL et triglycérides bas : un profil qui protège tes artères. ${c.ggt?`Ton foie s'améliore aussi (Gamma-GT à ${c.ggt.value}). `:""}Continue l'huile d'olive, les poissons gras, les fibres.`});
  if(c.crp) nutri.items.push({tone:c.crp.value>3?"warn":"good",h:`Inflammation (CRP) : ${c.crp.value} mg/L`,
    body:c.crp.value>3?"Légèrement au-dessus du seuil (≤ 3). Cible les causes : tabac, sommeil, alcool, aliments ultra-transformés. Une alimentation méditerranéenne + oméga-3 aide à la faire baisser. À recontrôler.":"Dans la norme — bon signe pour tes artères et ton âge biologique."});
  if(c.vitD) nutri.items.push({tone:c.vitD.value<30?"warn":"good",h:`Vitamine D : ${c.vitD.value} ng/mL`,
    body:c.vitD.value<30?"En dessous de 30 (insuffisant). Utile pour os, muscles et immunité. Supplémentation à valider avec ton médecin, surtout en sortie d'hiver.":"Correct. Garde le cap, surtout l'hiver."});
  if(c.ferr.length>=2){ const a=c.ferr[0],b=c.ferr[c.ferr.length-1];
    if(b.v>a.v*1.5) nutri.items.push({tone:"info",h:`Ferritine en hausse (${a.v} → ${b.v} µg/L)`,
      body:"Encore dans la norme, mais elle a bien monté. La ferritine grimpe aussi avec l'inflammation — à relier à ta CRP et à surveiller au prochain bilan."}); }
  if(c.gly) nutri.items.push({tone:c.gly.value<100?"good":"warn",h:`Glycémie : ${c.gly.value} mg/dL`,
    body:c.gly.value<100?"Normale — et ta sensibilité à l'insuline est excellente d'après ton bilan. Un vrai point fort.":"Un peu élevée — à surveiller avec ton médecin."});
  if(nutri.items.length) S.push(nutri);

  // Suivi médical
  const med={icon:"🩺",title:"Suivi médical — à garder à l'œil",items:[]};
  if(c.psa.length>=2){ const first=c.psa[0].v,last=c.psa[c.psa.length-1].v;
    med.items.push({tone:"info",h:`PSA : ${first} → ${last} µg/L`,
      body:`Toujours bien en dessous du seuil général (4,0), et ton urologue a jugé la densité rassurante. La légère tendance à la hausse vaut d'être <b>mentionnée à chaque contrôle annuel</b> — sans inquiétude particulière à ce stade.`}); }
  if(c.bioGap!=null) med.items.push({tone:c.bioGap>0?"warn":"good",h:`Âge biologique ${c.bioGap>0?"+"+c.bioGap+" ans":"≤ âge réel"}`,
    body:c.bioGap>0?`Un score composite (pas un diagnostic) tiré par l'inflammation et le stress oxydatif. Le bon côté : ce sont des leviers sur lesquels tu peux agir dès cette semaine.`:"Ton corps « fait plus jeune » que ton âge — continue."});
  med.items.push({tone:"info",h:"Le rythme des contrôles",
    body:"Un bilan sanguin par an, contrôle urologique/PSA selon ton urologue, et tension au repos. Note tout ici pour voir les tendances plutôt que des points isolés."});
  S.push(med);

  return S;
}

/* ============================================================

    saveStore(); toast("Pesée ajoutée ✓"); render();

      row.querySelector("button").onclick=()=>{ STORE.manual.lab_entries=STORE.manual.lab_entries.filter(x=>x.date!==e.date); saveStore(); render(); };

  // --- Arrêt du tabac ---
  const sfNow=smokeFree();
  const tCard=h(`<div class="card" style="padding:18px;margin-bottom:16px">

  // --- Sauvegarde / restauration ---
  const mCard=h(`<div class="card" style="padding:18px">
    ${sectionTitle("💾 Sauvegarde & remise à zéro")}

    const blob=new Blob([JSON.stringify(STORE,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);

}

/* ============================================================
   Import Apple Santé — worker (unzip via DecompressionStream)
   ============================================================ */
function importHealth(file, card){
  const prog=card.querySelector("#hkprog"), bar=prog.querySelector("i"), msg=card.querySelector("#hkmsg");
  prog.style.display="block"; bar.style.width="4%"; msg.textContent="Lecture du fichier…";
  const worker=makeWorker();
  worker.onmessage=ev=>{
    const m=ev.data;
    if(m.type==="progress"){ bar.style.width=Math.min(96,m.pct||10)+"%"; if(m.msg)msg.textContent=m.msg; }
    else if(m.type==="error"){ bar.style.width="0"; msg.textContent="❌ "+m.msg; toast("Import impossible : "+m.msg); worker.terminate(); }
    else if(m.type==="done"){ bar.style.width="100%"; msg.textContent="Terminé ✓"; worker.terminate();
      applyImport(m.data); }
  };
  worker.onerror=e=>{ msg.textContent="❌ Erreur d'analyse"; toast("Erreur pendant l'analyse du fichier"); };
  const win = card.querySelector("#hkwindow");
  const monthsWindow = (win && win.checked) ? 12 : null;
  worker.postMessage({file, monthsWindow});
}

function applyImport(d){
  // Résumé lisible
  const parts=[];
  if(d.runs.length) parts.push(d.runs.length+" courses");
  if(d.vo2max.length) parts.push(d.vo2max.length+" VO2 max");
  if(d.weight_daily.length) parts.push(d.weight_daily.length+" pesées");
  if(d.sleep_nightly.length) parts.push(d.sleep_nightly.length+" nuits");
  STORE.imported={ vo2max:d.vo2max, rhr_daily:d.rhr_daily, weight_daily:d.weight_daily,
    sleep_nightly:d.sleep_nightly, runs:d.runs, other_activities:d.other_activities,
    meta:{source:"Apple Santé", when:new Date().toLocaleDateString("fr-BE")} };
  saveStore();
  toast("Import réussi : "+(parts.join(" · ")||"aucune donnée reconnue"));
  TAB="apercu"; render();
}

function makeWorker(){
  const src = `
  const ACT=${JSON.stringify(ACTIVITY_LABELS)};
  function parseAttrs(tag){ const o={}; const re=/(\\w+)="([^"]*)"/g; let m; while(m=re.exec(tag)){ o[m[1]]=m[2]; } return o; }
  function pDate(s){ const m=/(\\d{4})-(\\d\\d)-(\\d\\d) (\\d\\d):(\\d\\d):(\\d\\d)\\s*([+-])(\\d\\d)(\\d\\d)/.exec(s||"");
    if(!m) return null; const off=(m[7]==="-"?-1:1)*(parseInt(m[8])*60+parseInt(m[9]))*60000;
    const ms=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6])-off; return {ms,local:m[1]+"-"+m[2]+"-"+m[3],hour:+m[4],dt:m[1]+"-"+m[2]+"-"+m[3]+"T"+m[4]+":"+m[5]+":"+m[6]}; }
  function localDateShift(ms,hoursBack){ const d=new Date(ms-hoursBack*3600000); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }

  const acc={ vo2:[], rhr:{}, weight:[], sleep:{}, runs:[], otherList:[], cur:null, records:0 };
  function pushAvg(map,date,val){ if(!map[date])map[date]={s:0,n:0}; map[date].s+=val; map[date].n++; }

  function onRecord(a){
    acc.records++;
    const t=a.type, v=parseFloat(a.value);
    if(t==="HKQuantityTypeIdentifierVO2Max"){ const d=pDate(a.startDate); if(d&&!isNaN(v)) acc.vo2.push({date:d.local,value:+v.toFixed(2)}); }
    else if(t==="HKQuantityTypeIdentifierRestingHeartRate"){ const d=pDate(a.startDate); if(d&&!isNaN(v)) pushAvg(acc.rhr,d.local,v); }
    else if(t==="HKQuantityTypeIdentifierBodyMass"){ const d=pDate(a.startDate); if(d&&!isNaN(v)){ let kg=v; if((a.unit||"").toLowerCase().indexOf("lb")>=0) kg=v*0.45359237; acc.weight.push({date:d.local,value:kg}); } }
    else if(t==="HKCategoryTypeIdentifierSleepAnalysis"){
      const ds=pDate(a.startDate), de=pDate(a.endDate); if(!ds||!de) return;
      const mins=(de.ms-ds.ms)/60000; if(mins<=0||mins>16*60) return;
      const val=a.value||""; let stage=null;
      if(/Deep/.test(val)) stage="deep"; else if(/REM/.test(val)) stage="rem";
      else if(/Core/.test(val)) stage="core"; else if(/Asleep(Unspecified)?$/.test(val)||val==="HKCategoryValueSleepAnalysisAsleep") stage="core";
      if(!stage) return; // InBed / Awake ignorés
      const bucket=localDateShift(ds.ms,12);
      const s=acc.sleep[bucket]||(acc.sleep[bucket]={deep:0,rem:0,core:0});
      s[stage]+=mins;
    }
  }
  function onWorkout(a){
    const type=(a.workoutActivityType||"").replace("HKWorkoutActivityType","");
    const d=pDate(a.startDate);
    let dur=parseFloat(a.duration)||0; if((a.durationUnit||"min")==="sec") dur/=60;
    let dist=parseFloat(a.totalDistance); if((a.totalDistanceUnit||"km")==="mi"&&!isNaN(dist)) dist*=1.609344;
    let kcal=parseFloat(a.totalEnergyBurned); if((a.totalEnergyBurnedUnit||"kcal")==="kJ"&&!isNaN(kcal)) kcal/=4.184;
    const w={type,date:d?d.local:null,datetime:d?d.dt:null,duration_min:+dur.toFixed(1),
      distance_km:isNaN(dist)?null:+dist.toFixed(2),energy_kcal:isNaN(kcal)?null:Math.round(kcal),avg_hr:null,max_hr:null};
    if(type==="Running"){ acc.runs.push(w); acc.cur=w; }
    else { acc.cur=w; acc.otherList.push({type,date:w.date,duration:dur}); }
    if(a._selfclose) acc.cur=null;
  }
  function onStat(a,workoutOpen){
    if(!acc.cur) return;
    if(a.type==="HKQuantityTypeIdentifierHeartRate"){
      const avg=parseFloat(a.average), mx=parseFloat(a.maximum);
      if(!isNaN(avg)) acc.cur.avg_hr=Math.round(avg);
      if(!isNaN(mx)) acc.cur.max_hr=Math.round(mx);
    } else if(a.type==="HKQuantityTypeIdentifierDistanceWalkingRunning" && acc.cur.distance_km==null){
      const s=parseFloat(a.sum); if(!isNaN(s)) acc.cur.distance_km=+s.toFixed(2);
    } else if(a.type==="HKQuantityTypeIdentifierActiveEnergyBurned" && acc.cur.energy_kcal==null){
      const s=parseFloat(a.sum); if(!isNaN(s)) acc.cur.energy_kcal=Math.round(s);
    }
  }

  const tokRe=/<(Record|Workout|WorkoutStatistics)\\b([^>]*)>|<\\/Workout>/g;
  function processBuffer(buf){
    const cut=buf.lastIndexOf(">"); if(cut<0) return buf;
    const chunk=buf.slice(0,cut+1); const rest=buf.slice(cut+1);
    tokRe.lastIndex=0; let m;
    while(m=tokRe.exec(chunk)){
      if(m[0]==="</Workout>"){ acc.cur=null; continue; }
      const tag=m[1], attrsRaw=m[2]||""; const a=parseAttrs(attrsRaw);
      a._selfclose=/\\/\\s*$/.test(attrsRaw);
      if(tag==="Record") onRecord(a);
      else if(tag==="Workout") onWorkout(a);
      else if(tag==="WorkoutStatistics") onStat(a);
    }
    return rest;
  }

  function finalize(monthsWindow){
    let rhr_daily=Object.keys(acc.rhr).sort().map(d=>({date:d,value:+(acc.rhr[d].s/acc.rhr[d].n).toFixed(1)}));
    const weightMap={}; acc.weight.forEach(w=>{ (weightMap[w.date]=weightMap[w.date]||[]).push(w.value); });
    let weight_daily=Object.keys(weightMap).sort().map(d=>({date:d,value:+(weightMap[d].reduce((x,y)=>x+y,0)/weightMap[d].length).toFixed(2)}));
    let sleep_nightly=Object.keys(acc.sleep).sort().map(d=>{ const s=acc.sleep[d]; return {date:d,deep:+s.deep.toFixed(1),rem:+s.rem.toFixed(1),core:+s.core.toFixed(1),total:+(s.deep+s.rem+s.core).toFixed(1)}; })
      .filter(n=>n.total>60);
    const vo2Map={}; acc.vo2.forEach(v=>vo2Map[v.date]=v.value);
    let vo2max=Object.keys(vo2Map).sort().map(d=>({date:d,value:vo2Map[d]}));
    // effort par FC
    acc.runs.forEach(r=>{ if(r.avg_hr==null){ r.effort=null; } else if(r.avg_hr<=152) r.effort="facile"; else if(r.avg_hr>=160) r.effort="intense"; else r.effort="modere";
      if(r.distance_km&&r.duration_min) r.pace_min_km=+(r.duration_min/r.distance_km).toFixed(2); else r.pace_min_km=null; });
    let runs=acc.runs.filter(r=>r.date&&r.distance_km>0).sort((a,b)=>a.datetime<b.datetime?-1:1);
    let otherList=acc.otherList.slice();

    // Fenêtre « N derniers mois » : coupe relativement à la donnée la plus récente
    if(monthsWindow){
      const allDates=[]
        .concat(vo2max.map(x=>x.date),rhr_daily.map(x=>x.date),weight_daily.map(x=>x.date),
                sleep_nightly.map(x=>x.date),runs.map(x=>x.date),otherList.map(x=>x.date))
        .filter(Boolean);
      if(allDates.length){
        const maxD=allDates.reduce((a,b)=>a>b?a:b);
        const md=new Date(maxD+"T00:00:00"); md.setMonth(md.getMonth()-monthsWindow);
        const cut=md.toISOString().slice(0,10);
        const keep=x=>x.date>=cut;
        vo2max=vo2max.filter(keep); rhr_daily=rhr_daily.filter(keep);
        weight_daily=weight_daily.filter(keep); sleep_nightly=sleep_nightly.filter(keep);
        runs=runs.filter(keep); otherList=otherList.filter(keep);
      }
    }

    const othersMap={};
    otherList.forEach(o=>{ if(!othersMap[o.type])othersMap[o.type]={count:0,duration:0}; othersMap[o.type].count++; othersMap[o.type].duration+=o.duration; });
    const other_activities=Object.keys(othersMap).map(t=>({type:t,label:ACT[t]||t,count:othersMap[t].count,duration:Math.round(othersMap[t].duration)})).sort((a,b)=>b.count-a.count);
    return {vo2max,rhr_daily,weight_daily,sleep_nightly,runs,other_activities};
  }

  async function findExportXml(buf){
    const dv=new DataView(buf), bytes=new Uint8Array(buf);
    // EOCD
    let eocd=-1; for(let i=bytes.length-22;i>=Math.max(0,bytes.length-22-65536);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
    if(eocd<0) throw new Error("ZIP illisible");
    let cdOff=dv.getUint32(eocd+16,true), cdCount=dv.getUint16(eocd+10,true);
    // ZIP64 ?
    if(cdOff===0xffffffff){ throw new Error("Archive trop grande (ZIP64). Dézippe-la et choisis export.xml."); }
    let p=cdOff, best=null;
    for(let i=0;i<cdCount;i++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      const method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true);
      const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commLen=dv.getUint16(p+32,true);
      const lho=dv.getUint32(p+42,true);
      const name=new TextDecoder().decode(bytes.subarray(p+46,p+46+nameLen));
      if(/(^|\\/)export\\.xml$/.test(name)){ best={name,method,compSize,lho}; }
      p+=46+nameLen+extraLen+commLen;
    }
    if(!best) throw new Error("export.xml introuvable dans le zip");
    // local header
    const lNameLen=dv.getUint16(best.lho+26,true), lExtra=dv.getUint16(best.lho+28,true);
    const dataStart=best.lho+30+lNameLen+lExtra;
    const comp=bytes.subarray(dataStart,dataStart+best.compSize);
    return {comp,method:best.method};
  }

  async function run(file, monthsWindow){
    const name=(file.name||"").toLowerCase();
    let stream;
    if(name.endsWith(".xml")){
      postMessage({type:"progress",pct:8,msg:"Lecture de export.xml…"});
      stream=file.stream();
    } else {
      postMessage({type:"progress",pct:6,msg:"Ouverture du zip…"});
      const buf=await file.arrayBuffer();
      const {comp,method}=await findExportXml(buf);
      if(method===0){ stream=new Blob([comp]).stream(); }
      else if(method===8){
        if(typeof DecompressionStream==="undefined") throw new Error("Navigateur trop ancien pour dézipper — dézippe sur ordinateur et choisis export.xml");
        stream=new Blob([comp]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      } else throw new Error("Compression zip non supportée");
    }
    const reader=stream.getReader(), dec=new TextDecoder("utf-8");
    let buf="", bytesRead=0;
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      bytesRead+=value.length;
      buf+=dec.decode(value,{stream:true});
      buf=processBuffer(buf);
      if(acc.records%1===0){} // noop
      postMessage({type:"progress",pct:10+Math.min(80,bytesRead/1500000),msg:acc.records.toLocaleString("fr")+" mesures lues · "+acc.runs.length+" courses…"});
    }
    buf+=dec.decode(); processBuffer(buf+">");
    postMessage({type:"progress",pct:98,msg:"Agrégation…"});
    postMessage({type:"done",data:finalize(monthsWindow)});
  }

  onmessage=async e=>{ try{ await run(e.data.file, e.data.monthsWindow); }catch(err){ postMessage({type:"error",msg:(err&&err.message)||"échec"}); } };
  `;
  const blob=new Blob([src],{type:"application/javascript"});
  return new Worker(URL.createObjectURL(blob));
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

/* ---------- Resize : redessine l'onglet courant ---------- */
let rzT;
window.addEventListener("resize",()=>{ clearTimeout(rzT); rzT=setTimeout(render,180); });

/* ---------- Go ---------- */
render();

/* ---------- Service worker ---------- */
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }); }
</script>
